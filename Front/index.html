<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>LeadRadar</title>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" style="
        font-family: system-ui, -apple-system, sans-serif;
        color: #eef2ff;
        background: #0b1020;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      ">
        <div>Chargement de l'application…</div>
      </div>
    </div>

    <script>
      // Filet de sécurité : si l'app plante avant même que React ne démarre,
      // on affiche l'erreur brute directement dans la page (pas besoin de la console).
      function showBootError(title, detail) {
        var root = document.getElementById("root");
        if (!root) return;
        root.innerHTML =
          '<div style="font-family: system-ui, -apple-system, sans-serif; ' +
          'background: #2a0f0f; color: #ffd7d7; padding: 24px; margin: 24px; ' +
          'border: 1px solid #7a2b2b; border-radius: 12px; white-space: pre-wrap; ' +
          'word-break: break-word; font-size: 14px; line-height: 1.5;">' +
          '<strong style="font-size: 16px;">⚠️ ' + title + '</strong><br/><br/>' +
          (detail || "") +
          '</div>';
      }

      window.addEventListener("error", function (e) {
        showBootError(
          "L'application a rencontré une erreur",
          (e.message || "Erreur inconnue") +
            (e.filename ? "\n\nFichier : " + e.filename + ":" + e.lineno : "") +
            (e.error && e.error.stack ? "\n\n" + e.error.stack : "")
        );
      });

      window.addEventListener("unhandledrejection", function (e) {
        var reason = e.reason;
        var text = reason && reason.stack ? reason.stack : String(reason);
        showBootError("Erreur asynchrone non gérée", text);
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
